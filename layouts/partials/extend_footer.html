<script>
(function() {
    var elements = document.querySelectorAll('.gc-views');
    if (!elements.length) return;

    var t = setInterval(function() {
        if (window.goatcounter && window.goatcounter.visit_count) {
            clearInterval(t);

            elements.forEach(function(el) {
                var path = el.getAttribute('data-path');
                if (!path) return;

                var r = new XMLHttpRequest();
                r.addEventListener('load', function() {
                    if (r.status === 200) {
                        var data = JSON.parse(r.responseText);
                        el.textContent = '조회수 ' + data.count;
                    } else {
                        el.textContent = '';
                    }
                });
                r.addEventListener('error', function() {
                    el.textContent = '';
                });
                r.open('GET', 'https://ljweel-github-pages.goatcounter.com/counter/' + encodeURIComponent(path) + '.json');
                r.send();
            });
        }
    }, 100);

    setTimeout(function() { clearInterval(t); }, 5000);
})();


document.addEventListener('click', function(e) {
  const tooltip = e.target.closest('.tooltip');
  if (tooltip) {
    tooltip.classList.toggle('active');
  } else {
    document.querySelectorAll('.tooltip.active').forEach(function(el) {
      el.classList.remove('active');
    });
  }
});

function adjustTooltip(tip) {
  var text = tip.querySelector('.tooltip-text');
  if (!text) return;

  if (window.innerWidth < 1300) {
    var post = tip.closest('.post-content');
    if (!post) return;

    var tipRect = tip.getBoundingClientRect();
    var postRect = post.getBoundingClientRect();

    var tipCenter = tipRect.left + tipRect.width / 2;
    var distFromLeft = tipCenter - postRect.left;
    var distFromRight = postRect.right - tipCenter;
    var maxByPosition = Math.min(distFromLeft, distFromRight) * 2 - 20;

    text.style.maxWidth = Math.min(500, maxByPosition) + 'px';
  } else {
    text.style.maxWidth = '500px';
  }
}

document.querySelectorAll('.tooltip').forEach(adjustTooltip);

// 창 크기 변경 시 재계산
window.addEventListener('resize', function() {
  document.querySelectorAll('.tooltip').forEach(adjustTooltip);
});

</script>
