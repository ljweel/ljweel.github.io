<script>
(function() {
    var el = document.getElementById('gc-views');
    if (!el) return;

    var t = setInterval(function() {
        if (window.goatcounter && window.goatcounter.visit_count) {
            clearInterval(t);

            // JSON API로 현재 페이지 조회수 가져오기
            var path = window.goatcounter.get_data
                ? window.goatcounter.get_data()['p']
                : location.pathname;

            var r = new XMLHttpRequest();
            r.addEventListener('load', function() {
                if (r.status === 200) {
                    var data = JSON.parse(r.responseText);
                    el.textContent = '조회수 ' + data.count;
                } else {
                    el.textContent = '';
                }
            });
            r.addEventListener('error', function() {
                el.textContent = '';
            });
            r.open('GET', 'https://ljweel-github-pages.goatcounter.com/counter/' + encodeURIComponent(path) + '.json');
            r.send();
        }
    }, 100);

    // 5초 후에도 로드 안 되면 타이머 정리
    setTimeout(function() { clearInterval(t); }, 5000);
})();
</script>

{{- /* Footer custom content area end */ -}}
