<script>
(function() {
    var elements = document.querySelectorAll('.gc-views');
    if (!elements.length) return;

    var t = setInterval(function() {
        if (window.goatcounter && window.goatcounter.visit_count) {
            clearInterval(t);

            elements.forEach(function(el) {
                var path = el.getAttribute('data-path');
                if (!path) return;

                var r = new XMLHttpRequest();
                r.addEventListener('load', function() {
                    if (r.status === 200) {
                        var data = JSON.parse(r.responseText);
                        el.textContent = '조회수 ' + data.count;
                    } else {
                        el.textContent = '';
                    }
                });
                r.addEventListener('error', function() {
                    el.textContent = '';
                });
                r.open('GET', 'https://ljweel-github-pages.goatcounter.com/counter/' + encodeURIComponent(path) + '.json');
                r.send();
            });
        }
    }, 100);

    setTimeout(function() { clearInterval(t); }, 5000);
})();


document.addEventListener('click', function(e) {
  const tooltip = e.target.closest('.tooltip');
  if (tooltip) {
    tooltip.classList.toggle('active');
  } else {
    document.querySelectorAll('.tooltip.active').forEach(function(el) {
      el.classList.remove('active');
    });
  }
});


function adjustTooltip(tip) {
  const text = tip.querySelector('.tooltip-text');
  if (!text) return;

  const tipRect = tip.getBoundingClientRect();
  const tipCenter = tipRect.left + tipRect.width / 2; // 툴팁의 수평 중앙 위치

  // 1. 왼쪽 끝까지의 거리: tipCenter - 0
  const distFromLeft = tipCenter;
  // 2. 오른쪽 끝까지의 거리: 브라우저 너비 - tipCenter
  const distFromRight = window.innerWidth - tipCenter;

  // 두 거리 중 최소값의 2배 (여백 20px 제외)
  const maxW = Math.min(distFromLeft, distFromRight) * 2 - 20;

  // CSS 변수로 전달하거나 직접 스타일 적용
  text.style.maxWidth = `${Math.min(500, maxW)}px`;
}

document.querySelectorAll('.tooltip').forEach(adjustTooltip);

// 창 크기 변경 시 재계산
window.addEventListener('resize', function() {
  document.querySelectorAll('.tooltip').forEach(adjustTooltip);
});


</script>
