<script>
(function() {
    var elements = document.querySelectorAll('.gc-views');
    if (!elements.length) return;

    var baseUrl = 'https://ljweel-github-pages.goatcounter.com/counter/';

    function fetchCount(path, callback) {
        var r = new XMLHttpRequest();
        r.addEventListener('load', function() {
            if (r.status === 200) {
                var raw = JSON.parse(r.responseText).count;
                var num = parseInt(raw.replace(/[^0-9]/g, ''), 10) || 0;
                callback(num);
            } else {
                callback(0);
            }
        });
        r.addEventListener('error', function() { callback(0); });
        r.open('GET', baseUrl + encodeURIComponent(path) + '.json');
        r.send();
    }

    var t = setInterval(function() {
        if (window.goatcounter && window.goatcounter.visit_count) {
            clearInterval(t);

            elements.forEach(function(el) {
                var children = el.getAttribute('data-children');

                if (children) {
                    // 번들: 하위 글들의 조회수 합산
                    var paths = children.split(',');
                    var total = 0;
                    var done = 0;

                    paths.forEach(function(path) {
                        fetchCount(path, function(count) {
                            total += count;
                            done++;
                            if (done === paths.length) {
                                el.textContent = '조회수 ' + total.toLocaleString();
                            }
                        });
                    });
                } else {
                    // 일반 글: 개별 조회수
                    var path = el.getAttribute('data-path');
                    if (!path) return;

                    fetchCount(path, function(count) {
                        el.textContent = count > 0 ? '조회수 ' + count.toLocaleString() : '';
                    });
                }
            });
        }
    }, 100);

    setTimeout(function() { clearInterval(t); }, 5000);
})();

document.addEventListener('click', function(e) {
  const tooltip = e.target.closest('.tooltip');
  if (tooltip) {
    tooltip.classList.toggle('active');
  } else {
    document.querySelectorAll('.tooltip.active').forEach(function(el) {
      el.classList.remove('active');
    });
  }
});


function adjustTooltip(tip) {
  const text = tip.querySelector('.tooltip-text');
  if (!text) return;

  const tipRect = tip.getBoundingClientRect();
  const tipCenter = tipRect.left + tipRect.width / 2; // 툴팁의 수평 중앙 위치

  // 1. 왼쪽 끝까지의 거리: tipCenter - 0
  const distFromLeft = tipCenter;
  // 2. 오른쪽 끝까지의 거리: 브라우저 너비 - tipCenter
  const distFromRight = window.innerWidth - tipCenter;

  // 두 거리 중 최소값의 2배 (여백 20px 제외)
  const maxW = Math.min(distFromLeft, distFromRight) * 2 - 20;

  // CSS 변수로 전달하거나 직접 스타일 적용
  text.style.maxWidth = `${Math.min(500, maxW)}px`;
}

document.querySelectorAll('.tooltip').forEach(adjustTooltip);

// 창 크기 변경 시 재계산
window.addEventListener('resize', function() {
  document.querySelectorAll('.tooltip').forEach(adjustTooltip);
});






</script>

{{- /* Footer custom content area end */ -}}
